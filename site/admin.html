<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — FOM Fall Guys Tournament</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body class="admin">
    <div class="layout">
    <main>
      <h1>
        <a class="back" href="/index.html">← Dashboard</a>
        Admin <span id="publish-badge" class="badge"></span>
        <span id="capture-badge" class="badge" hidden></span>
      </h1>
      <div id="data-problems" class="banner" hidden></div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="shows">Shows</button>
        <button type="button" role="tab" data-tab="players">Players</button>
        <button type="button" role="tab" data-tab="info">Info</button>
      </div>

      <div data-panel="shows" role="tabpanel">
        <section>
          <p id="watch-status" class="status"></p>
          <div id="shows"></div>
        </section>

        <section>
          <h2>Publish</h2>
          <div class="publish">
            <div class="field">
              <label for="publish-message">Commit message</label>
              <input id="publish-message" type="text" />
            </div>
            <div class="actions">
              <button id="publish" type="button" class="primary">Commit &amp; push</button>
              <span id="publish-status" class="status"></span>
            </div>
            <p id="publish-mode" class="hint"></p>
          </div>
        </section>
      </div>

      <div data-panel="players" role="tabpanel" hidden>
        <section>
          <div id="players"></div>
          <div class="actions">
            <button id="add-player" type="button">Add player</button>
            <button id="toggle-linked" type="button"></button>
            <button id="save-players" type="button" class="primary">Save players</button>
            <span id="players-status" class="status"></span>
          </div>
        </section>
      </div>

      <div data-panel="info" role="tabpanel" hidden>
        <section>
          <dl class="paths">
            <dt>Fall Guys log</dt>
            <dd id="log-path"></dd>
            <dt>Screenshots</dt>
            <dd id="shot-dir"></dd>
          </dl>
        </section>
        <section>
          <h2>On the recorded screen</h2>
          <img id="capture-frame" alt="The newest frame the recorder wrote" hidden />
          <p id="capture-frame-status" class="status"></p>
        </section>
      </div>

      <datalist id="registered"></datalist>
      <datalist id="candidates"></datalist>
      <datalist id="show-names"></datalist>
    </main>
    <aside id="shots" class="shot-panel"></aside>
    </div>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
